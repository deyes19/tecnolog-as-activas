<style>
:root {
  --green:#006837; --green2:#003d24; --lime:#8cc63f; --yellow:#f4c542;
  --cream:#f7faf7; --ink:#102019; --muted:#40524a; --white:#fff;

}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#064d30 0%,#022617 100%);color:var(--ink);overflow:hidden}
button{font:inherit}
.app{height:100%;display:grid;grid-template-rows:52px 1fr 70px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;background:rgba(1,25,16,.48);border-bottom:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800}.mark{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--yellow),var(--lime),#fff,var(--yellow));box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.shortcuts{display:flex;gap:7px;font-size:12px}.shortcuts span{padding:6px 9px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 54px}.deck{width:min(1320px,94vw);height:min(730px,77vh);position:relative}
.slide{position:absolute;inset:0;border-radius:22px;overflow:hidden;padding:48px 64px;background:#ffffff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s ease;isolation:isolate}
.slide::before{content:"";position:absolute;width:300px;height:300px;right:-150px;bottom:-150px;border-radius:50%;background:radial-gradient(circle,rgba(0,104,55,.10),transparent 68%);z-index:-1}
.slide::after{content:"";position:absolute;width:180px;height:180px;right:-80px;top:-100px;border-radius:36px;transform:rotate(12deg);background:linear-gradient(135deg,rgba(244,197,66,.20),rgba(140,198,63,.04));z-index:-1}
.slide.active{opacity:1;pointer-events:auto;z-index:5}
.kicker{font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--green);margin-bottom:12px}
h1{font-size:54px;line-height:1.08;margin:0 0 16px;color:var(--green2);max-width:1050px} h2{font-size:40px;line-height:1.16;margin:0 0 20px;color:var(--green2)} h3{font-size:24px;margin:0 0 10px;color:var(--green)}
p{font-size:23px;line-height:1.42;margin:0 0 12px} .lead{font-size:30px;max-width:1020px} .subtitle{font-size:21px;color:var(--muted)} .small{font-size:18px;color:var(--muted)}
ul,ol{font-size:22px;line-height:1.48;margin:8px 0 0 24px;padding:0} li{margin:5px 0}
.accent{height:8px;width:120px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow));margin:18px 0 24px} .center-accent{margin-left:auto;margin-right:auto}
.grid{display:grid;gap:17px} .two{grid-template-columns:1fr 1fr} .three{grid-template-columns:repeat(3,1fr)} .four{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid rgba(0,104,55,.16);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.08)} .card.dark{background:linear-gradient(140deg,var(--green),var(--green2));border:0;color:#fff} .card.dark h3,.card.dark p,.card.dark li{color:#fff} .card.yellow{background:linear-gradient(140deg,#fff6cc,#fff);border-color:rgba(244,197,66,.55)}
.num{font-size:58px;font-weight:950;color:var(--green);line-height:1} .center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center} .question{font-size:42px;line-height:1.22;font-weight:950;color:var(--green2);max-width:1100px}
.case{background:#fff;border-left:8px solid var(--green);border-radius:18px;padding:26px 30px;box-shadow:0 10px 25px rgba(0,0,0,.08)} .case p{font-size:23px}
.timeline{display:grid;gap:10px} .timeline.five{grid-template-columns:repeat(5,1fr)} .time-step{background:#fff;border:1px solid rgba(0,104,55,.15);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:0 12px 25px rgba(0,0,0,.07)} .time-step .emoji{font-size:32px} .time-step b{display:block;color:var(--green2);margin:6px 0} .time-step span{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0;border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.08);font-size:16px} th{background:var(--green);color:#fff;text-align:left;padding:12px 13px} td{padding:11px 13px;border-bottom:1px solid #e4ece7;vertical-align:top} tr:last-child td{border:0} td strong{color:var(--green2)}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px} .vote button,.control,.mini-btn{border:0;border-radius:14px;padding:12px 13px;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 9px 20px rgba(0,0,0,.14);transition:.18s} .vote button:hover,.control:hover,.mini-btn:hover{transform:translateY(-2px);filter:brightness(1.06)} .vote button:nth-child(1){background:#7a8782} .vote button:nth-child(2){background:var(--blue)} .vote button:nth-child(3){background:var(--green)} .vote button:nth-child(4){background:#e58d20}
.feedback{display:none;margin-top:17px;padding:14px 17px;border-radius:14px;background:#eaf8f0;border:1px solid #bfe7cf;color:var(--green2);font-size:19px} .feedback.show{display:block}
.tags{display:flex;flex-wrap:wrap;gap:9px} .tag{display:inline-block;padding:9px 13px;border-radius:999px;background:#e6f5ec;color:var(--green);font-weight:850} .tag.alt{background:#fff0b8;color:#725400}
.timerbox{position:absolute;right:62px;top:52px;display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid rgba(0,104,55,.18);border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px)} .timertext{min-width:62px;text-align:center;font-weight:950;color:var(--green2);font-variant-numeric:tabular-nums} .mini-btn{padding:7px 10px;border-radius:999px;background:var(--green2);font-size:12px;box-shadow:none}
.reveal{filter:blur(9px);user-select:none;cursor:pointer;transition:.35s} .reveal.visible{filter:none} .hint{text-align:center;color:var(--muted);font-size:14px;margin-top:9px}
footer{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff} .control{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);box-shadow:none} .round{width:46px;height:46px;border-radius:50%;padding:0;font-size:23px} .progress{width:min(700px,51vw);height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden} .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#fff1a4);transition:.3s} .counter{min-width:70px;text-align:center;font-weight:800}
.notes{display:none;position:fixed;right:18px;bottom:82px;width:390px;max-height:60vh;overflow:auto;z-index:30;background:#fff;border-radius:20px;padding:19px;box-shadow:0 25px 70px rgba(0,0,0,.38);border:1px solid rgba(0,104,55,.18)} .notes.show{display:block} .notes h4{margin:0 0 9px;color:var(--green2)} .notes p{font-size:14px;white-space:pre-line}
.overview{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,24,15,.94);padding:45px;overflow:auto} .overview.show{display:block} .overview h2{color:#fff} .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px} .thumb{background:#fff;border-radius:16px;padding:16px;min-height:115px;cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.24);transition:.2s} .thumb:hover{transform:translateY(-4px)} .thumb b{font-size:12px;color:var(--green)} .thumb p{font-size:15px;font-weight:850;margin-top:8px}
.footer-note{position:absolute;left:62px;bottom:31px;font-size:14px;color:var(--muted)}

.resource-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
.resource-card{background:#fff;border:1px solid rgba(0,104,55,.16);border-radius:18px;padding:16px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.resource-title{font-size:22px;font-weight:900;color:var(--green2);margin-bottom:10px}
.resource-flex{display:grid;grid-template-columns:1fr 180px;gap:16px;align-items:center}
.resource-thumb{width:100%;max-height:250px;object-fit:contain;border-radius:12px;background:#f7faf7;border:1px solid #e3ece7}
.resource-qr{width:160px;height:160px;display:block;margin:0 auto;border-radius:10px;border:1px solid #e3ece7;background:#fff}
.qr-wrap{text-align:center}.qr-label{font-size:14px;font-weight:800;color:var(--muted);margin-top:6px}

<div class="app">
<header><div class="brand"><div class="mark"></div><span>Universidad de Córdoba · CINTIA · Tecnologías Activas</span></div><div class="shortcuts"><span>← → navegar</span><span>N notas</span><span>O vista</span><span>F pantalla completa</span><span>V voz</span></div></header>

<aside class="notes" id="notes"><h4>Notas del capacitador</h4><p id="notesText"></p></aside>
<div class="overview" id="overview"><h2>Vista general</h2><div class="thumbs" id="thumbs"></div></div>
<script>
const slides = [{"title": "Portada", "minutes": 1, "notes": "Saluda y marca el tono: no será una capacitación de aplicaciones, sino de diseño pedagógico con tecnología. Enfatiza que la sesión es práctica y que el objetivo es salir con criterios claros para elegir herramientas.", "body": "<div class=\"hero-layout\"><div><div class=\"kicker\">Capacitación docente · Educación superior</div><h1>Tecnologías Activas</h1><div class=\"accent\"></div><p class=\"lead\">Diseñar experiencias universitarias más participativas, cognitivas e inclusivas.</p><p class=\"subtitle\">ICAP · DUA · Rueda del DUA · Tecnologías emergentes</p></div><div class=\"hero-badge\"><div class=\"badge-main\">TA</div><div class=\"badge-sub\">Tecnología con sentido pedagógico</div></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Propósito", "minutes": 2, "notes": "Presenta la promesa central. Si los docentes esperan una lista de apps, reencuadra: las herramientas aparecerán, pero subordinadas al aprendizaje.", "body": "<div class=\"kicker\">Propósito de la jornada</div><h2>De usar herramientas a diseñar experiencias</h2><div class=\"grid three\"><div class=\"card\"><div class=\"num\">1</div><h3>Analizar</h3><p>Qué hace cognitivamente el estudiante cuando usa tecnología.</p></div><div class=\"card\"><div class=\"num\">2</div><h3>Anticipar</h3><p>Barreras de acceso, participación y expresión desde el DUA.</p></div><div class=\"card\"><div class=\"num\">3</div><h3>Diseñar</h3><p>Una actividad breve, viable y mediada con tecnología.</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Ruta de trabajo", "minutes": 2, "notes": "Explica que la capacitación está diseñada como una experiencia activa: primero problema, luego marco, aplicación, diseño y socialización.", "body": "<div class=\"kicker\">Ruta sugerida</div><h2>Una sesión activa para hablar de tecnologías activas</h2><div class=\"timeline five\"><div class=\"time-step\"><div class=\"emoji\">⚡</div><b>Provocación</b><span>Una misma IA, cuatro usos</span></div><div class=\"time-step\"><div class=\"emoji\">🧠</div><b>ICAP</b><span>Compromiso cognitivo</span></div><div class=\"time-step\"><div class=\"emoji\">♿</div><b>DUA</b><span>Barreras y opciones</span></div><div class=\"time-step\"><div class=\"emoji\">🛠️</div><b>Herramientas</b><span>Propósito antes que moda</span></div><div class=\"time-step\"><div class=\"emoji\">✅</div><b>Rediseño</b><span>Actividad aplicable</span></div></div><p class=\"small\" style=\"margin-top:22px\">La lógica no será “qué aplicación usar”, sino “qué aprendizaje queremos provocar y qué barreras debemos reducir”.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Reto inicial", "minutes": 4, "notes": "No expliques ICAP todavía. Pide que ordenen los cuatro casos de menor a mayor exigencia cognitiva. La clave es que todos usan ChatGPT y por eso deben mirar la actividad, no la herramienta.", "body": "<div class=\"kicker\">Reto inicial</div><h2>Encuentre la diferencia</h2><p class=\"lead\">Todos los casos usan la misma tecnología: <strong>ChatGPT</strong>. Haga clic sobre las tarjetas en el orden de <strong>menor a mayor exigencia cognitiva</strong>.</p>\n<div class=\"challenge-grid\">\n  <div class=\"challenge-card\" data-choice=\"A\" onclick=\"challengePick(this)\"><div class=\"challenge-order\"></div><h3>A</h3><p>El estudiante solicita una explicación de un concepto y la lee.</p></div>\n  <div class=\"challenge-card\" data-choice=\"B\" onclick=\"challengePick(this)\"><div class=\"challenge-order\"></div><h3>B</h3><p>El estudiante solicita características del concepto y las clasifica.</p></div>\n  <div class=\"challenge-card\" data-choice=\"C\" onclick=\"challengePick(this)\"><div class=\"challenge-order\"></div><h3>C</h3><p>El estudiante resuelve primero un caso y luego usa IA para detectar vacíos.</p></div>\n  <div class=\"challenge-card\" data-choice=\"D\" onclick=\"challengePick(this)\"><div class=\"challenge-order\"></div><h3>D</h3><p>Dos estudiantes comparan soluciones, usan IA como contrapunto y defienden una respuesta conjunta.</p></div>\n</div>\n<div class=\"challenge-controls\"><button class=\"challenge-btn secondary\" onclick=\"challengeReset(this)\">Reiniciar</button><span class=\"challenge-status\">Orden actual: —</span></div>\n<div class=\"challenge-result\"><p><strong>Orden sugerido:</strong> A → B → C → D.</p><p><strong>Lectura pedagógica:</strong> A se acerca a lo <em>pasivo</em>; B a lo <em>activo</em>; C a lo <em>constructivo</em>; y D a lo <em>interactivo</em>.</p><div class=\"challenge-key\"><span>A · Lee</span><span>B · Responde / clasifica</span><span>C · Produce y mejora</span><span>D · Dialoga y construye con otro</span></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Pregunta clave", "minutes": 3, "notes": "Pregunta al auditorio: si la herramienta es la misma, ¿por qué no es la misma experiencia de aprendizaje? Recolecta tres respuestas antes de mostrar la tesis.", "body": "<div class=\"center\"><div><div class=\"kicker\">Pregunta clave</div><div class=\"question\">Si todos usan la misma tecnología, ¿por qué no están aprendiendo de la misma manera?</div><div class=\"accent center-accent\"></div><p class=\"subtitle\">La diferencia no está en la aplicación. Está en la actividad cognitiva diseñada alrededor de ella.</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Tesis central", "minutes": 3, "notes": "Esta es la idea que debe permanecer toda la sesión. Úsala como criterio para corregir el enfoque instrumental.", "body": "<div class=\"kicker\">Tesis de trabajo</div><h2>La tecnología no hace activa una clase</h2><div class=\"grid two roomy-cards\"><div class=\"card dark\"><h3>Puede haber mucha tecnología…</h3><p>videos, plataformas, IA, cuestionarios, realidad virtual.</p></div><div class=\"card yellow\"><h3>…y poco aprendizaje activo</h3><p>si el estudiante solo recibe, copia, responde mecánicamente o repite.</p></div></div><p class=\"lead\" style=\"margin-top:28px\"><strong>Una tecnología es activa cuando ayuda al estudiante a pensar, decidir, construir, interactuar y demostrar lo aprendido.</strong></p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, { "title": "Origen de ICAP", "minutes": 4, "notes": "Explica por qué aparece ICAP antes de presentar los niveles. La idea clave: ICAP no se incluye como teoría decorativa, sino como criterio para analizar qué hace cognitivamente el estudiante cuando usa tecnología.", "body": "<div class=\"kicker\">¿Por qué ICAP?</div><h2>Un marco para no confundir herramienta con aprendizaje</h2><div class=\"grid two roomy-cards\"><div class=\"card\"><h3>De dónde sale</h3><p>ICAP fue propuesto por Michelene T. H. Chi y Ruth Wylie para relacionar el compromiso cognitivo observable con los resultados de aprendizaje.</p><p class=\"small\"><strong>Referencia base:</strong> Educational Psychologist, 2014.</p></div><div class=\"card dark\"><h3>Por qué lo incluimos</h3><p>Porque permite mirar más allá de la aplicación y preguntar qué hace realmente el estudiante: recibir, manipular, construir o interactuar.</p></div></div><div class=\"case compact-case\" style=\"margin-top:24px\"><p><strong>En esta capacitación, ICAP funciona como criterio de diseño:</strong> primero definimos la exigencia cognitiva; después escogemos la tecnología.</p></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Marco ICAP", "minutes": 5, "notes": "Presenta ICAP como marco para diferenciar niveles de compromiso cognitivo. No entres en exceso teórico; usa la escalera para que quede claro.", "body": "<div class=\"kicker\">Marco pedagógico 1</div><h2>ICAP: niveles de compromiso cognitivo</h2><div class=\"grid four roomy-cards\"><div class=\"card\"><h3>Pasivo</h3><p>Recibe: escucha, mira o lee.</p></div><div class=\"card\"><h3>Activo</h3><p>Manipula: responde, selecciona o clasifica.</p></div><div class=\"card yellow\"><h3>Constructivo</h3><p>Genera: explica, relaciona, crea o resuelve.</p></div><div class=\"card dark\"><h3>Interactivo</h3><p>Coconstruye: debate, cuestiona y mejora con otros.</p></div></div><p class=\"small\" style=\"margin-top:18px\">Referencia: Chi y Wylie, 2014.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Mini diagnóstico ICAP", "minutes": 5, "notes": "Usa esta diapositiva como un chequeo rápido. Pide responder antes de revelar. Sirve para que no quede solo teoría.", "body": "<div class=\"kicker\">Chequeo rápido</div><h2>¿Qué nivel ICAP predomina?</h2><div class=\"icap-quiz\" data-answer=\"Constructivo\"><div class=\"case compact-case\"><p>Los estudiantes resuelven primero un caso con sus propios argumentos y luego usan IA para encontrar vacíos, mejorar la respuesta y justificar los cambios.</p></div><div class=\"quiz-buttons\"><button onclick=\"quizPick(this,'Pasivo')\">Pasivo</button><button onclick=\"quizPick(this,'Activo')\">Activo</button><button onclick=\"quizPick(this,'Constructivo')\">Constructivo</button><button onclick=\"quizPick(this,'Interactivo')\">Interactivo</button></div><div class=\"quiz-feedback\"></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "ICAP aplicado", "minutes": 4, "notes": "Vuelve al reto inicial y revela el orden. Señala que tomar notas o hacer clic no es malo, pero no equivale a construcción profunda.", "body": "<div class=\"kicker\">Volvamos al reto</div><h2>Una misma IA, cuatro niveles de uso</h2><table class=\"compact-table\"><tr><th>Nivel</th><th>Uso de ChatGPT</th><th>Lo que hace el estudiante</th></tr><tr><td><strong>Pasivo</strong></td><td>Lee una explicación generada por IA.</td><td>Recibe información.</td></tr><tr><td><strong>Activo</strong></td><td>Clasifica características entregadas por IA.</td><td>Manipula información existente.</td></tr><tr><td><strong>Constructivo</strong></td><td>Contrasta su solución con la IA y la mejora.</td><td>Produce, revisa y reconstruye.</td></tr><tr><td><strong>Interactivo</strong></td><td>Debate con pares y usa IA como contrapunto.</td><td>Argumenta, negocia y coconstruye.</td></tr></table>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Criterio ICAP", "minutes": 3, "notes": "Deja una pregunta operativa. Esta pregunta guía la selección de tecnología. Pide que piensen en una clase propia.", "body": "<div class=\"center\"><div><div class=\"kicker\">Criterio de diseño</div><div class=\"question\">Antes de elegir una herramienta, pregunte: ¿qué quiero que haga cognitivamente mi estudiante?</div><div class=\"tags\" style=\"justify-content:center;margin-top:28px\"><span class=\"tag\">recibir</span><span class=\"tag\">responder</span><span class=\"tag alt\">construir</span><span class=\"tag alt\">interactuar</span></div></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Giro DUA", "minutes": 4, "notes": "Introduce el segundo problema. Haz que vean que una actividad cognitivamente fuerte puede fallar si no todos pueden acceder o expresar lo aprendido.", "body": "<div class=\"kicker\">Pero falta una pregunta</div><h2>Una actividad puede ser activa… y aun así excluir</h2><div class=\"case compact-case\"><p>“Los estudiantes analizan un caso, construyen una solución multimedia y la defienden oralmente frente al grupo”.</p></div><p class=\"small\" style=\"margin-top:12px\">Haga clic para revelar posibles barreras:</p><div class=\"barrier-row\"><button onclick=\"toggleBarrier(this)\">Acceso</button><button onclick=\"toggleBarrier(this)\">Comprensión</button><button onclick=\"toggleBarrier(this)\">Expresión oral</button><button onclick=\"toggleBarrier(this)\">Participación</button></div><div class=\"barrier-box\">Seleccione una barrera para discutir cómo anticiparla desde el diseño.</div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "DUA", "minutes": 5, "notes": "Presenta DUA como diseño anticipado para la variabilidad. Evita limitarlo a discapacidad: son barreras que puede enfrentar cualquier estudiante.", "body": "<div class=\"kicker\">Marco pedagógico 2</div><h2>DUA: diseñar para la variabilidad</h2><div class=\"grid three roomy-cards\"><div class=\"card dark\"><h3>Compromiso</h3><p>Opciones para motivarse, persistir y participar.</p></div><div class=\"card\"><h3>Representación</h3><p>Opciones para acceder y comprender la información.</p></div><div class=\"card yellow\"><h3>Acción y expresión</h3><p>Opciones para responder, crear y demostrar lo aprendido.</p></div></div><p class=\"small\" style=\"margin-top:18px\">Referencia base: CAST, Pautas DUA 3.0.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Rueda DUA", "minutes": 5, "notes": "Presenta la Rueda del DUA como recurso práctico. La advertencia es importante: no se usa para buscar apps al azar.", "body": "<div class=\"kicker\">Recurso práctico</div><h2>Rueda del DUA: tecnología para reducir barreras</h2><div class=\"grid two\"><div class=\"card\"><h3>Uso correcto</h3><ol class=\"step-list\"><li>Identificar una barrera.</li><li>Ubicar el principio DUA relacionado.</li><li>Elegir una herramienta pertinente.</li><li>Diseñar la actividad y la evidencia.</li></ol></div><div class=\"card yellow\"><h3>Evite este error</h3><p>No se trata de “mirar la rueda y escoger una app bonita”. La herramienta debe responder a una necesidad pedagógica real.</p><a class=\"drive-link\" href=\"https://www.antonioamarquez.com/rueda-del-dua/\" target=\"_blank\" rel=\"noopener\">Abrir Rueda del DUA ↗</a></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "ICAP + DUA", "minutes": 5, "notes": "Integra los marcos. Esta slide es clave para la identidad de la capacitación.", "body": "<div class=\"kicker\">Integración estratégica</div><h2>Profundidad cognitiva + accesibilidad</h2><div class=\"timeline five\"><div class=\"time-step\"><div class=\"emoji\">🎯</div><b>Resultado</b><span>Qué deben aprender</span></div><div class=\"time-step\"><div class=\"emoji\">🧠</div><b>ICAP</b><span>Qué harán cognitivamente</span></div><div class=\"time-step\"><div class=\"emoji\">🚧</div><b>DUA</b><span>Qué barreras anticipar</span></div><div class=\"time-step\"><div class=\"emoji\">🛠️</div><b>Tecnología</b><span>Qué herramienta facilita</span></div><div class=\"time-step\"><div class=\"emoji\">📌</div><b>Evidencia</b><span>Cómo demostrarán aprendizaje</span></div></div><p class=\"lead\" style=\"margin-top:28px\">Tecnologías activas = tecnología con propósito cognitivo e inclusivo.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Herramientas por propósito", "minutes": 5, "notes": "Agrupa herramientas por propósito para evitar el desfile de apps. Puedes mencionar ejemplos, pero la decisión depende del diseño.", "body": "<div class=\"kicker\">No por moda, sino por función</div><h2>Tecnologías activas según propósito pedagógico</h2><table class=\"compact-table resources-table\"><tr><th>Propósito</th><th>Herramientas posibles</th><th>Uso activo</th></tr><tr><td><strong>Participar y diagnosticar</strong></td><td>Mentimeter, Wooclap, Kahoot, Quizizz, Forms</td><td>Predecir, votar, justificar y contrastar ideas.</td></tr><tr><td><strong>Construir y colaborar</strong></td><td>Padlet, Miro, Canva, Docs, Teams</td><td>Cocrear productos, mapas, acuerdos o soluciones.</td></tr><tr><td><strong>Crear y comunicar</strong></td><td>Canva, Genially, video, podcast, infografía</td><td>Transformar información en productos comunicables.</td></tr><tr><td><strong>Simular y experimentar</strong></td><td>PhET, laboratorios virtuales, VR/AR</td><td>Ensayar, observar consecuencias y tomar decisiones.</td></tr></table>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "IA generativa", "minutes": 5, "notes": "Aquí profundizas en IA porque hoy genera interés. El mensaje no es prohibir ni romantizar: diseñar un uso que provoque pensamiento.", "body": "<div class=\"kicker\">Tecnología emergente clave</div><h2>IA generativa: de respuesta rápida a interlocutor intelectual</h2><div class=\"grid two\"><div class=\"card\"><h3>Uso débil</h3><p>“Pregúntale a la IA y copia una definición”.</p></div><div class=\"card dark\"><h3>Uso potente</h3><p>Resolver primero, contrastar con IA, detectar vacíos, mejorar argumentos y justificar decisiones.</p></div><div class=\"card yellow\"><h3>Riesgo</h3><p>Delegar pensamiento, citar sin verificar, homogeneizar respuestas.</p></div><div class=\"card\"><h3>Diseño recomendado</h3><p>IA como contrapunto, tutor socrático, generador de escenarios o apoyo de retroalimentación.</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Tecnologías emergentes", "minutes": 4, "notes": "Menciona que emergente no significa automáticamente mejor. Solo son valiosas si habilitan experiencias difíciles de lograr de otra manera.", "body": "<div class=\"kicker\">Más allá de las apps habituales</div><h2>Tecnologías emergentes con sentido pedagógico</h2><div class=\"grid four roomy-cards\"><div class=\"card\"><h3>IA</h3><p class=\"small\">Casos, retroalimentación, simulación, contraste.</p></div><div class=\"card\"><h3>VR/AR</h3><p class=\"small\">Exploración inmersiva, laboratorios y escenarios.</p></div><div class=\"card yellow\"><h3>Simuladores</h3><p class=\"small\">Ensayo-error, decisiones y consecuencias.</p></div><div class=\"card dark\"><h3>Analítica</h3><p class=\"small\">Seguimiento, alertas y evaluación formativa.</p></div></div><p class=\"lead\" style=\"margin-top:24px\">La pregunta no es si la tecnología es nueva, sino si amplía una posibilidad de aprendizaje.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Reto docente", "minutes": 4, "notes": "Da instrucciones claras. No pidas un rediseño de toda la asignatura: solo 20 o 30 minutos para que sea viable.", "body": "<div class=\"kicker\">Actividad central</div><h2>Rediseñe 20–30 minutos de una clase propia</h2><div class=\"grid two\"><div class=\"card\"><h3>Elija</h3><p>Un tema que normalmente desarrolla mediante explicación o exposición.</p></div><div class=\"card yellow\"><h3>Transforme</h3><p>Una parte de esa clase en una experiencia activa, accesible y viable.</p></div></div><div class=\"timerbox\"><span class=\"timertext\">20:00</span><button class=\"mini-btn\" onclick=\"startTimer(20)\">Iniciar</button><button class=\"mini-btn\" onclick=\"resetTimer()\">Reiniciar</button></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Plantilla interactiva", "minutes": 8, "notes": "Usa esta diapositiva como guía de trabajo. Si el grupo es grande, pide que respondan solo con frases cortas. Los campos son editables durante la sesión.", "body": "<div class=\"kicker\">Plantilla editable</div><h2>Del objetivo a la tecnología</h2><div class=\"design-grid\">\n  <div><strong>¿Qué quiero que aprendan?</strong><span contenteditable=\"true\">Escriba el resultado...</span></div>\n  <div><strong>¿Qué hará cognitivamente?</strong><span contenteditable=\"true\">Activo / constructivo / interactivo...</span></div>\n  <div><strong>¿Qué barreras pueden aparecer?</strong><span contenteditable=\"true\">Acceso, comprensión, motivación...</span></div>\n  <div><strong>¿Qué opción DUA ofreceré?</strong><span contenteditable=\"true\">Texto, audio, imagen, video...</span></div>\n  <div><strong>¿Qué tecnología facilita?</strong><span contenteditable=\"true\">Herramienta seleccionada...</span></div>\n  <div><strong>¿Qué evidencia quedará?</strong><span contenteditable=\"true\">Producto, explicación, decisión...</span></div>\n</div><p class=\"small\" style=\"margin-top:12px\">Tip: puede escribir directamente sobre los campos durante la capacitación.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Socialización", "minutes": 6, "notes": "Pide socialización breve. El análisis no debe centrarse en si la app gustó, sino en tres criterios: actividad cognitiva, barreras y evidencia.", "body": "<div class=\"kicker\">Socialización breve</div><h2>Analicemos cada propuesta con tres lentes</h2><div class=\"grid three roomy-cards\"><div class=\"card dark\"><h3>ICAP</h3><p>¿Qué nivel de compromiso cognitivo promueve?</p></div><div class=\"card yellow\"><h3>DUA</h3><p>¿Qué barrera anticipa y qué opción ofrece?</p></div><div class=\"card\"><h3>Evidencia</h3><p>¿Cómo sabremos que hubo aprendizaje?</p></div></div><p class=\"lead\" style=\"margin-top:26px\">Retroalimentar no es decir “me gustó”; es mejorar la viabilidad pedagógica del diseño.</p>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Errores comunes", "minutes": 4, "notes": "Esta slide ayuda a aterrizar. Úsala con franqueza: son errores reales de capacitación tecnológica.", "body": "<div class=\"kicker\">Alertas necesarias</div><h2>Errores que debemos evitar</h2><div class=\"grid two\"><div class=\"card\"><h3>Confundir interacción con aprendizaje</h3><p>Hacer clic no siempre implica pensar mejor.</p></div><div class=\"card\"><h3>Elegir la app antes del propósito</h3><p>La herramienta debe llegar después del objetivo y la actividad.</p></div><div class=\"card yellow\"><h3>Ignorar barreras</h3><p>Una buena actividad puede excluir si no ofrece opciones de acceso o expresión.</p></div><div class=\"card dark\"><h3>Evaluar solo el producto final</h3><p>También importa el proceso, la argumentación y la toma de decisiones.</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Cierre", "minutes": 3, "notes": "Cierra con una idea memorable. Pide un compromiso pequeño: una actividad que transformarán en su próxima clase.", "body": "<div class=\"center\"><div><div class=\"kicker\">Cierre</div><h1 style=\"max-width:1100px\">No pregunte primero qué tecnología usar.</h1><p class=\"lead\" style=\"margin-top:20px\">Pregunte qué quiere que haga cognitivamente su estudiante y qué barreras debe anticipar.</p><div class=\"accent center-accent\"></div><p class=\"subtitle\">Una tecnología activa ayuda a pensar mejor, participar mejor y demostrar mejor lo aprendido.</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Referencias", "minutes": 2, "notes": "Muestra las referencias principales. Puedes indicar que la rueda es un recurso práctico, mientras que ICAP y DUA sostienen la arquitectura pedagógica de la sesión.", "body": "<div class=\"kicker\">Referencias base</div><h2>Fundamentos utilizados</h2><div class=\"resource-grid\"><div class=\"resource-card\"><div class=\"resource-title\">ICAP</div><p class=\"small\">Chi, M. T. H., & Wylie, R. (2014). <em>The ICAP Framework: Linking Cognitive Engagement to Active Learning Outcomes</em>. Educational Psychologist, 49(4), 219–243. DOI: 10.1080/00461520.2014.965823</p></div><div class=\"resource-card\"><div class=\"resource-title\">DUA</div><p class=\"small\">CAST. (2024). <em>CAST Universal Design for Learning Guidelines version 3.0</em>. https://udlguidelines.cast.org/</p></div><div class=\"resource-card\"><div class=\"resource-title\">Rueda del DUA</div><p class=\"small\">Márquez, A. A. (2022). <em>Rueda del DUA V4 / Rueda DUA Genially</em>. https://www.antonioamarquez.com/rueda-del-dua/</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}, {"title": "Gracias", "minutes": 1, "notes": "Agradece e invita a llevarse la plantilla de rediseño como herramienta de trabajo. Si habrá continuidad, menciona que el siguiente paso sería construir secuencias activas por programa.", "body": "<div class=\"center\"><div><div class=\"kicker\">Gracias</div><h1>Tecnologías activas para una docencia universitaria más consciente</h1><p class=\"lead\">Equipo Pedagógico de CINTIA</p></div></div>\n<div class=\"footer-note\">Equipo Pedagógico de CINTIA</div>"}];
let current = Math.max(0, Math.min(slides.length-1, (parseInt(new URLSearchParams(location.search).get('slide')||'1',10)||1)-1)), timerInterval=null, timerSeconds=0;

function update(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===current));
  document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;
  document.getElementById('bar').style.width=`${((current+1)/slides.length)*100}%`;
  document.getElementById('notesText').textContent=slides[current].notes||'';
  resetTimerToSlide();
}
function next(){ if(current<slides.length-1){current++; update();} }
function prev(){ if(current>0){current--; update();} }
function go(i){ current=i; document.getElementById('overview').classList.remove('show'); update(); }
function buildThumbs(){
  document.getElementById('thumbs').innerHTML=slides.map((s,i)=>`<div class="thumb" onclick="go(${i})"><b>Diapositiva ${i+1}</b><p>${s.title}</p><span class="small">${s.minutes} min</span></div>`).join('');
}
function feedback(btn){ const fb=btn.closest('.slide').querySelector('.feedback'); if(fb) fb.classList.add('show'); }

function challengePick(card){
  const slide=card.closest('.slide');
  slide._challengeOrder = slide._challengeOrder || [];
  const choice=card.dataset.choice;
  if(slide._challengeOrder.includes(choice)) return;
  slide._challengeOrder.push(choice);
  card.classList.add('selected');
  const badge=card.querySelector('.challenge-order');
  if(badge) badge.textContent=slide._challengeOrder.length;
  const status=slide.querySelector('.challenge-status');
  if(status) status.textContent=`Orden actual: ${slide._challengeOrder.join(' → ')}`;
  if(slide._challengeOrder.length===4) challengeEvaluate(slide);
}
function challengeEvaluate(slide){
  const expected=['A','B','C','D'];
  const given=slide._challengeOrder || [];
  slide.querySelectorAll('.challenge-card').forEach(card=>{
    const choice=card.dataset.choice;
    if(given.indexOf(choice)===expected.indexOf(choice)) card.classList.add('correct');
    else card.classList.add('wrong');
  });
  const result=slide.querySelector('.challenge-result');
  const status=slide.querySelector('.challenge-status');
  const correct=given.join('')===expected.join('');
  if(status) status.textContent = correct ? `¡Muy bien! Orden final: ${given.join(' → ')}` : `Tu orden fue: ${given.join(' → ')}. Revisa la clave sugerida.`;
  if(result) result.classList.add('show');
}
function challengeReset(btn){
  const slide=btn.closest('.slide');
  slide._challengeOrder=[];
  slide.querySelectorAll('.challenge-card').forEach(card=>{
    card.classList.remove('selected','correct','wrong');
    const badge=card.querySelector('.challenge-order');
    if(badge) badge.textContent='';
  });
  const status=slide.querySelector('.challenge-status');
  if(status) status.textContent='Orden actual: —';
  const result=slide.querySelector('.challenge-result');
  if(result) result.classList.remove('show');
}
function quizPick(btn,choice){
  const wrap=btn.closest('.icap-quiz');
  const ans=wrap.dataset.answer;
  wrap.querySelectorAll('.quiz-buttons button').forEach(b=>b.classList.remove('selected','wrong'));
  btn.classList.add(choice===ans?'selected':'wrong');
  const fb=wrap.querySelector('.quiz-feedback');
  if(choice===ans){ fb.innerHTML='<strong>Correcto.</strong> Predomina lo constructivo: el estudiante produce primero, contrasta, revisa y mejora su propia respuesta.'; }
  else { fb.innerHTML='<strong>Revisemos.</strong> No basta con usar IA: aquí el punto fuerte es que el estudiante genera y reconstruye una solución propia.'; }
}
function toggleBarrier(btn){
  const slide=btn.closest('.slide');
  slide.querySelectorAll('.barrier-row button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

    'Participación':'¿La dinámica permite roles claros y participación real? Alternativa: roles de análisis, síntesis, verificación y vocería.'
  };
  const box=slide.querySelector('.barrier-box');
  box.textContent=content[btn.textContent.trim()] || 'Seleccione una barrera para discutir cómo anticiparla desde el diseño.';
}

function fmt(sec){ const m=String(Math.floor(sec/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0'); return `${m}:${s}`; }
function getTimerDisplay(){ return document.querySelector('.slide.active .timertext'); }
function resetTimerToSlide(){ clearInterval(timerInterval); timerSeconds=(slides[current].minutes||0)*60; const d=getTimerDisplay(); if(d) d.textContent=fmt(timerSeconds); }
function startTimer(mins){ clearInterval(timerInterval); timerSeconds=(mins||slides[current].minutes||0)*60; const d=getTimerDisplay(); if(d) d.textContent=fmt(timerSeconds); timerInterval=setInterval(()=>{timerSeconds--; if(d)d.textContent=fmt(Math.max(0,timerSeconds)); if(timerSeconds<=0) clearInterval(timerInterval);},1000); }
function resetTimer(){ resetTimerToSlide(); }
function speak(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text=(deck.querySelector('.slide.active')?.innerText || '').replace(/\s+/g,' ');
  const u=new SpeechSynthesisUtterance(text); u.lang='es-CO'; speechSynthesis.speak(u);
}
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev;
document.getElementById('notesBtn').onclick=()=>document.getElementById('notes').classList.toggle('show');
document.getElementById('overviewBtn').onclick=()=>document.getElementById('overview').classList.toggle('show');
document.getElementById('voiceBtn').onclick=speak;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown')next(); if(e.key==='ArrowLeft'||e.key==='PageUp')prev();
  if(e.key.toLowerCase()==='n')document.getElementById('notes').classList.toggle('show');
  if(e.key.toLowerCase()==='o')document.getElementById('overview').classList.toggle('show');
  if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();
  if(e.key.toLowerCase()==='v')speak();
  if(e.key==='Escape')document.getElementById('overview').classList.remove('show');
});
renderDeck();
</script>
